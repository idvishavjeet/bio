<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Sheets Connection Test</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #172554 0%,
            #0b1220 45%,
            #03060b 100%
        );

    color:#ffffff;
}


/* ===============================
   MAIN CARD
================================ */

.card{

    width:min(100%,430px);

    padding:30px;

    border-radius:24px;

    background:
        rgba(15,23,42,.94);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    backdrop-filter:
        blur(16px);
}


/* ===============================
   ICON
================================ */

.icon{

    width:68px;
    height:68px;

    margin:
        0 auto 18px;

    border-radius:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:32px;

    background:#172554;

}


/* ===============================
   TITLE
================================ */

h1{

    text-align:center;

    font-size:25px;

    margin:
        0 0 8px;

}


.subtitle{

    text-align:center;

    color:#a8b4c7;

    font-size:14px;

    line-height:1.6;

    margin:
        0 0 25px;

}


/* ===============================
   LABEL
================================ */

label{

    display:block;

    margin-bottom:8px;

    font-size:14px;

    font-weight:700;

}


/* ===============================
   INPUT
================================ */

input{

    width:100%;

    height:54px;

    padding:
        0 15px;

    border-radius:13px;

    border:
        1px solid #33445e;

    outline:none;

    background:#070e1a;

    color:#ffffff;

    font-size:18px;

}


input::placeholder{

    color:#66758d;

}


input:focus{

    border-color:#668cff;

    box-shadow:
        0 0 0 3px
        rgba(102,140,255,.12);

}


/* ===============================
   BUTTON
================================ */

button{

    width:100%;

    height:54px;

    margin-top:16px;

    border:0;

    border-radius:13px;

    background:#4f7cff;

    color:#ffffff;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


button:hover{

    filter:brightness(1.08);

}


button:active{

    transform:scale(.98);

}


button:disabled{

    opacity:.65;

    cursor:not-allowed;

}


/* ===============================
   RESULT
================================ */

#result{

    display:none;

    margin-top:18px;

    padding:15px;

    border-radius:13px;

    font-size:14px;

    line-height:1.6;

}


.success{

    display:block !important;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid rgba(74,222,128,.30);

    color:#bbf7d0;

}


.error{

    display:block !important;

    background:
        rgba(239,68,68,.12);

    border:
        1px solid rgba(248,113,113,.30);

    color:#fecaca;

}


/* ===============================
   CONNECTION STATUS
================================ */

.status{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:16px;

    font-size:12px;

    color:#94a3b8;

}


.dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#22c55e;

}


/* ===============================
   FOOTER
================================ */

.footer{

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:11px;

    line-height:1.5;

}


/* ===============================
   MOBILE
================================ */

@media(max-width:480px){

    body{

        padding:14px;

    }

    .card{

        padding:23px;

    }

}

</style>

</head>


<body>


<main class="card">


    <div class="icon">
        📊
    </div>


    <h1>
        Google Sheets Test
    </h1>


    <p class="subtitle">
        एक नंबर enter करके Google Sheets
        connection को test करें।
    </p>


    <form id="testForm">


        <label for="testNumber">
            Test Number
        </label>


        <input

            id="testNumber"

            type="text"

            inputmode="numeric"

            autocomplete="off"

            maxlength="30"

            placeholder="Example: 12345"

            required

        >


        <button

            id="sendButton"

            type="submit"

        >

            SEND TEST DATA

        </button>


    </form>


    <div id="result"></div>


    <div class="status">

        <span class="dot"></span>

        <span>
            GitHub → Apps Script → Google Sheets
        </span>

    </div>


    <div class="footer">

        TEST MODE — Registration system अभी शामिल नहीं है।

    </div>


</main>



<script>


/* ==========================================
   NEW GOOGLE APPS SCRIPT WEB APP URL
========================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwQRNCZ5P2GVTY_2Guxacs8KHYzLKy-mVSwFVRWIJPaH9C0IA_4yDryd4VHvtUXsoUv/exec";



/* ==========================================
   ELEMENTS
========================================== */

const form =
document.getElementById("testForm");

const input =
document.getElementById("testNumber");

const button =
document.getElementById("sendButton");

const result =
document.getElementById("result");



/* ==========================================
   ONLY NUMBERS ALLOWED
========================================== */

input.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/[^0-9]/g,"")
            .slice(0,30);

    }
);



/* ==========================================
   FORM SUBMIT
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const number =
            input.value.trim();


        /* ------------------------------
           VALIDATION
        ------------------------------ */

        if(!number){

            showResult(

                "❌ कृपया कोई number enter करें।",

                "error"

            );

            return;

        }


        /* ------------------------------
           BUTTON LOADING
        ------------------------------ */

        button.disabled = true;

        button.textContent =
            "SENDING...";


        result.className = "";

        result.style.display =
            "none";


        try{


            /* --------------------------
               SEND DATA
            -------------------------- */

            await fetch(

                GOOGLE_SCRIPT_URL,

                {

                    method:"POST",

                    mode:"no-cors",

                    headers:{

                        "Content-Type":
                        "text/plain;charset=utf-8"

                    },

                    body:JSON.stringify({

                        test:true,

                        testNumber:number,

                        testTime:
                        new Date().toISOString()

                    })

                }

            );


            /* --------------------------
               SHOW RESULT
            -------------------------- */

            showResult(

                "✅ Test request भेज दी गई।<br><br>" +

                "Test Number: <b>" +

                escapeHTML(number) +

                "</b><br><br>" +

                "अब Google Sheet खोलकर check करें।<br><br>" +

                "अगर यह number नई row में दिखाई देता है, " +

                "तो <b>GitHub → Apps Script → " +

                "Google Sheets</b> connection successfully working है।",

                "success"

            );


            /* --------------------------
               CLEAR INPUT
            -------------------------- */

            input.value = "";


        }

        catch(error){


            console.error(
                "Google Sheets Error:",
                error
            );


            showResult(

                "❌ Data send नहीं हो पाया।<br><br>" +

                "Internet connection और " +

                "Apps Script deployment check करें।",

                "error"

            );

        }


        /* --------------------------
           ENABLE BUTTON
        -------------------------- */

        button.disabled = false;

        button.textContent =
            "SEND TEST DATA";


    }
);



/* ==========================================
   SHOW RESULT
========================================== */

function showResult(message,type){

    result.innerHTML =
        message;

    result.className =
        type;

}



/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

    return String(value).replace(

        /[&<>"']/g,

        function(character){

            const map = {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            };

            return map[character];

        }

    );

}

</script>


</body>
</html>

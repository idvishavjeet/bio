<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="विश्वजीत चौहान - Futuristic & Interactive Professional Portfolio">
    <title>विश्वजीत चौहान - Professional Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #05070e;
            --bg-card: rgba(13, 19, 33, 0.85);
            --bg-card-hover: rgba(20, 29, 49, 0.95);
            --border-glass: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --accent: #c084fc;
            --gradient-main: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
            --gradient-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.05), rgba(192, 132, 252, 0.05));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
        }

        body {
            font-family: 'Inter', 'Noto Sans Devnagari', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.7;
            font-size: 1.05rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ✨ WELCOME SCREEN */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 14, 0.98); backdrop-filter: blur(25px);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; transition: opacity 0.6s ease;
        }
        .welcome-top-ticker { position: absolute; top: 0; left: 0; width: 100%; background: rgba(56, 189, 248, 0.1); border-bottom: 1px solid var(--border-glass); padding: 12px 0; overflow: hidden; white-space: nowrap; }
        .welcome-ticker-text { display: inline-block; animation: scrollTicker 20s linear infinite; color: var(--primary); font-weight: 600; font-size: 1rem; letter-spacing: 0.5px; }
        .welcome-card { background: var(--bg-card); border: 1px solid rgba(192, 132, 252, 0.35); padding: 45px 35px; border-radius: 28px; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(192, 132, 252, 0.2); max-width: 550px; width: 100%; animation: floatWelcome 4s ease-in-out infinite; }
        @keyframes floatWelcome { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .welcome-card h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .welcome-card h1 { font-size: 2rem; font-weight: 800; margin-bottom: 15px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-card p { color: var(--text-muted); margin-bottom: 30px; font-size: 1.05rem; line-height: 1.8; }
        
        .welcome-enter-btn {
            position: relative; overflow: hidden; width: 100%; padding: 16px; border-radius: 14px;
            border: none; background: transparent; color: #fff; font-size: 1.15rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; z-index: 1; box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }
        .welcome-enter-btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 300%; height: 300%;
            background: conic-gradient(from 0deg, transparent 70%, var(--primary) 85%, var(--accent) 100%);
            transform: translate(-50%, -50%); animation: rotateBg 3s linear infinite; z-index: -2;
        }
        .welcome-enter-btn::after {
            content: ''; position: absolute; inset: 2px; background: #0d1321; border-radius: 12px; z-index: -1; transition: 0.3s;
        }
        .welcome-enter-btn:hover::after { background: rgba(20, 29, 49, 0.95); }
        .welcome-enter-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(192, 132, 252, 0.4); }

        /* MAIN CONTENT */
        #main-website { display: none; opacity: 0; transition: opacity 0.8s ease; width: 100%; }
        .top-sad-ticker { width: 100%; background: rgba(13, 19, 33, 0.95); border-bottom: 1px solid rgba(248, 113, 113, 0.25); padding: 10px 0; overflow: hidden; white-space: nowrap; }
        .top-sad-text { display: inline-block; font-size: 0.95rem; color: #fca5a5; font-style: italic; }
        @keyframes dynamicTicker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        @keyframes scrollTicker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        header { width: 100%; min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px 20px 60px; }
        .hero-reveal { opacity: 0; transform: translateY(30px); animation: cinematicReveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; width: 100%; }
        .hero-reveal.delay-1 { animation-delay: 0.1s; }
        .hero-reveal.delay-2 { animation-delay: 0.3s; }
        .hero-reveal.delay-3 { animation-delay: 0.5s; }
        .hero-reveal.delay-4 { animation-delay: 0.7s; }
        @keyframes cinematicReveal { to { opacity: 1; transform: translateY(0); } }

        .profile-img-wrapper { position: relative; width: 240px; height: 240px; margin: 0 auto 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .neon-ring { position: absolute; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .ring-1 { width: 240px; height: 240px; border: 2px dashed rgba(56, 189, 248, 0.6); animation: spinRing 15s linear infinite; }
        .ring-2 { width: 260px; height: 260px; border: 1px solid rgba(192, 132, 252, 0.3); box-shadow: 0 0 25px rgba(192, 132, 252, 0.3); animation: spinRingReverse 20s linear infinite; }
        .ring-3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%); animation: pulseNeon 3s ease-in-out infinite; }
        @keyframes spinRing { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spinRingReverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes pulseNeon { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }

        .profile-photo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; background-color: #131b2e; border: 4px solid rgba(255,255,255,0.05); box-shadow: 0 0 40px rgba(56, 189, 248, 0.6); position: relative; z-index: 5; transition: transform 0.4s ease, box-shadow 0.4s ease; }
        .profile-photo:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(192, 132, 252, 0.8); }

        #dynamic-name { font-family: 'Poppins', sans-serif; font-size: clamp(2.5rem, 5vw, 4.2rem); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .name-divider { width: 140px; height: 4px; background: var(--gradient-main); border-radius: 4px; margin: 15px auto 20px auto; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
        .rotating-role-box { font-size: 1.15rem; color: var(--primary); font-weight: 600; margin-bottom: 35px; height: 30px; display: flex; justify-content: center; align-items: center; text-transform: uppercase; letter-spacing: 1px; }
        .rotating-role-text { opacity: 1; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }
        .role-hidden { opacity: 0; transform: translateY(-10px); }

        .action-cards-container { position: relative; width: 100%; max-width: 400px; height: 60px; margin: 10px auto 30px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: rgba(5, 7, 14, 0.4); border-radius: 20px; border: 1px inset rgba(255,255,255,0.05); }
        .action-card-slide { position: absolute; width: 100%; display: flex; justify-content: center; opacity: 0; transform: translateY(30px); transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; }
        .action-card-slide.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .action-card-btn { background: transparent; padding: 12px 28px; border-radius: 14px; color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; width: 100%; justify-content: center; }
        .action-card-btn.instagram i { color: #e1306c; font-size: 1.3rem; }
        .action-card-btn.whatsapp i { color: #22c55e; font-size: 1.3rem; }
        .action-card-btn.google i { color: #38bdf8; font-size: 1.3rem; }
        .action-card-btn:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* --------------------------------------
           ✨ HERO BUTTONS (RUNNING GRADIENT)
           -------------------------------------- */
        .hero-cta-buttons {
            display: flex; justify-content: space-between; gap: 8px; flex-wrap: nowrap; 
            margin-top: 20px; width: 100%; max-width: 650px; margin-left: auto; margin-right: auto;
        }
        
        .hero-btn {
            position: relative; overflow: hidden; background: transparent; border: none;
            padding: 14px 10px; border-radius: 30px; color: #fff; font-weight: 600;
            font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
            gap: 5px; transition: all 0.3s ease; cursor: pointer; flex: 1; z-index: 1; white-space: nowrap;
        }
        /* Buttons specific colors */
        .btn-grad-1::before { background: conic-gradient(from 0deg, transparent 70%, #ec4899 85%, #f43f5e 100%); }
        .btn-grad-2::before { background: conic-gradient(from 0deg, transparent 70%, #10b981 85%, #3b82f6 100%); }
        .btn-grad-3::before { background: conic-gradient(from 0deg, transparent 70%, #a855f7 85%, #ec4899 100%); }
        .btn-grad-4::before { background: conic-gradient(from 0deg, transparent 70%, #f59e0b 85%, #ef4444 100%); }
        
        .hero-btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 300%; height: 300%;
            transform: translate(-50%, -50%); animation: rotateBg 3s linear infinite; z-index: -2;
        }
        .hero-btn::after {
            content: ''; position: absolute; inset: 2px;
            background: #0d1321; border-radius: 30px; z-index: -1; transition: background 0.3s ease;
        }
        .hero-btn:hover::after { background: rgba(20, 29, 49, 0.95); }
        .hero-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); }

        /* --------------------------------------
           🔥 UNIVERSAL ROTATING NEON BORDER (CLEAN INNER BLEED)
           -------------------------------------- */
        .animated-border-box {
            position: relative; z-index: 1;
            background: transparent !important; border: none !important;
        }
        .border-spinner {
            position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: -2; pointer-events: none;
        }
        
        /* Multiple Gradient Themes */
        .spin-cyan-purple::before { background: conic-gradient(from 0deg, transparent 65%, #38bdf8 85%, #c084fc 100%); }
        .spin-rose-amber::before { background: conic-gradient(from 0deg, transparent 65%, #f43f5e 85%, #fbbf24 100%); }
        .spin-emerald-blue::before { background: conic-gradient(from 0deg, transparent 65%, #10b981 85%, #3b82f6 100%); }
        .spin-purple-pink::before { background: conic-gradient(from 0deg, transparent 65%, #a855f7 85%, #ec4899 100%); }
        .spin-amber-red::before { background: conic-gradient(from 0deg, transparent 65%, #f59e0b 85%, #ef4444 100%); }

        .border-spinner::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 250%;
            transform: translate(-50%, -50%); animation: rotateBg 4s linear infinite;
        }
        .animated-border-box::after {
            content: ''; position: absolute; inset: 2px; /* 2px perfect crisp border, NO Inner bleed */
            background: var(--bg-card); border-radius: inherit; z-index: -1; pointer-events: none; transition: background 0.3s ease;
        }
        .animated-border-box.active::after { background: rgba(18, 27, 46, 0.98); }
        .animated-border-box.hover-effect:hover::after { background: var(--bg-card-hover); }
        @keyframes rotateBg { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Modals */
        #generic-popup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 14, 0.85); backdrop-filter: blur(10px); z-index: 10001; display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease; overflow: hidden; }
        #generic-popup-modal.show { opacity: 1; visibility: visible; }
        .popup-modal-content { background: var(--bg-card); border: 1px solid var(--accent); padding: 35px 30px; border-radius: 20px; max-width: 550px; width: 100%; text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(192,132,252,0.2); transform: scale(0.9); transition: transform 0.3s ease; max-height: 85vh; overflow-y: auto; }
        #generic-popup-modal.show .popup-modal-content { transform: scale(1); }
        
        .popup-modal-content h3 { font-family: 'Poppins', sans-serif; font-size: 1.5rem; margin-bottom: 18px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .popup-modal-content p { font-size: 1.05rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 18px; text-align: justify;}

        /* Container */
        .container { width: 100%; max-width: 1050px; margin: 0 auto; padding: 20px 20px 80px; }

        /* Life Timer */
        .life-timer-card { padding: 25px 20px; margin-bottom: 25px; text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,0.4); border-radius: 20px; }
        .life-timer-title { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .timer-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
        .timer-box { background: rgba(15, 23, 42, 0.75); border: 1px solid var(--border-glass); border-radius: 10px; padding: 8px 4px; position: relative; z-index: 2;}
        .timer-num { font-size: 1.15rem; font-weight: 800; color: var(--primary); font-family: 'Poppins', sans-serif; }
        .timer-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 1px; }

        .depart-section-inner { margin-top: 18px; border-top: 1px dashed var(--border-glass); padding-top: 16px; text-align: left; position: relative; z-index: 2;}
        .depart-btn { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 8px 18px; border-radius: 30px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.3s ease; width: 100%; justify-content: center; }
        .depart-btn:hover { background: rgba(239, 68, 68, 0.22); border-color: #f87171; color: #fff; }
        .depart-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease; }
        .depart-content.show { max-height: 800px; padding-top: 15px; }
        .depart-content p { font-size: 0.92rem; color: #cbd5e1; line-height: 1.75; margin-bottom: 12px; font-style: italic; border-left: 3px solid #f87171; padding-left: 12px; }

        /* Stats & Accordion */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 45px; justify-content: center; }
        .stat-card { padding: 24px; display: flex; align-items: center; gap: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s; border-radius: 20px; cursor: pointer;}
        .stat-card:hover { transform: translateY(-3px); }
        .stat-icon { width: 55px; height: 55px; background: var(--gradient-bg); border: 1px solid var(--border-glass); border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; color: var(--primary); flex-shrink: 0; }
        .stat-info h4 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-info p { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 0; }

        .accordion-card { margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); border-radius: 20px; transition: all 0.35s ease; }
        .accordion-card.active { box-shadow: 0 20px 50px rgba(56, 189, 248, 0.2); }
        .accordion-header { padding: 26px 30px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; transition: background 0.3s ease; position: relative; z-index: 2;}
        .accordion-title-wrapper { display: flex; align-items: center; gap: 16px; }
        .accordion-icon-box { width: 50px; height: 50px; background: var(--gradient-bg); border: 1px solid var(--border-glass); border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; color: var(--primary); }
        .accordion-title { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .accordion-chevron { font-size: 1.2rem; color: var(--text-muted); transition: transform 0.35s ease, color 0.35s ease; }
        .accordion-card.active .accordion-chevron { transform: rotate(180deg); color: var(--primary); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease; padding: 0 30px; position: relative; z-index: 2; }
        .accordion-card.active .accordion-content { max-height: 3500px; padding: 0 30px 35px 30px; }
        p { color: var(--text-muted); margin-bottom: 20px; font-size: 1.08rem; line-height: 1.9; }

        .highlight-cyan { color: var(--primary); font-weight: 600; }
        .highlight-violet { color: var(--accent); font-weight: 600; }
        .badge-pill { display: inline-block; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--primary); padding: 4px 14px; border-radius: 20px; font-size: 0.9r
